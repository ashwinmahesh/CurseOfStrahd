name: iOS builds

on:
  pull_request:
    paths:
      - .github/workflows/ios.yml
      - tools/release/ios*.py
      - tests/tools/test_ios*.py
  workflow_dispatch:
    inputs:
      operation:
        description: Build the app, inspect the listing, or upload reviewed listing assets
        type: choice
        options: [build, inspect-listing, update-listing]
        default: build
      version:
        description: App version (major.minor.patch)
        required: true
        default: '1.0.0'
      build_kind:
        description: Full game or a small signing/upload check (no gameplay)
        type: choice
        options: [game, smoke]
        default: game
      source_ref:
        description: Optional game commit/ref from this repository (blank = workflow commit)
        type: string
        default: ''
      upload:
        description: Upload to App Store Connect for TestFlight processing (app-store only)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ios-${{ contains(inputs.operation, 'listing') && 'listing' || github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.2'
  GODOT_MAC_SHA512: 38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca
  TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/release
            tests/tools
      - run: python3 -m unittest discover -s tests/tools -p 'test_ios*.py' -v
  archive:
    needs: tooling
    if: github.event_name == 'workflow_dispatch' && !contains(inputs.operation, 'listing')
    runs-on: macos-15
    timeout-minutes: 350
    env:
      VERSION: ${{ inputs.version }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      EXPORT_METHOD: app-store
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
      BUILD_KIND: ${{ inputs.build_kind }}
      UPLOAD: ${{ inputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          path: pipeline
          sparse-checkout: |
            tools/release
            tests/tools

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          lfs: false
          path: game
          sparse-checkout: ${{ inputs.build_kind == 'smoke' && 'art/ui/app_icon.png' || '' }}
          sparse-checkout-cone-mode: false

      - name: Record source commit
        run: |
          # The port exporter accepts integer build numbers; reserve room for reruns.
          IOS_BUILD="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          echo "IOS_BUILD=$IOS_BUILD" >> "$GITHUB_ENV"
          # Keep this outside IOS_OUT: the full-port exporter requires a fresh output directory.
          git -C game rev-parse HEAD > "$RUNNER_TEMP/ios-source-commit.txt"
          echo "Source commit: $(cat "$RUNNER_TEMP/ios-source-commit.txt")" >> "$GITHUB_STEP_SUMMARY"
          echo "Build kind: $BUILD_KIND; version $VERSION ($IOS_BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check configuration before downloading assets
        env:
          IOS_SIGNING_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.IOS_APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.IOS_APPLE_API_KEY_P8 }}
        run: |
          echo "IOS_OUT=$RUNNER_TEMP/ios-build" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re
          required = ['IOS_BUNDLE_ID', 'APPLE_TEAM_ID', 'APP_STORE_APP_ID', 'IOS_SIGNING_P12', 'IOS_PROVISIONING_PROFILE']
          if os.environ['UPLOAD'] == 'true':
              assert os.environ['EXPORT_METHOD'] == 'app-store', 'TestFlight requires app-store signing'
              required += ['KEY_ID', 'ISSUER_ID', 'KEY_P8']
          missing = [key for key in required if not os.environ.get(key)]
          assert not missing, 'Missing GitHub configuration: ' + ', '.join(missing)
          assert re.fullmatch(r'\d+\.\d+\.\d+', os.environ['VERSION']), 'Version must be major.minor.patch'
          PY
          if [ "$BUILD_KIND" = game ] && [ ! -f game/tools/release/ios.py ]; then
            echo '::error::Full-game builds require the iOS port. Select its commit in source_ref or choose smoke.'
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install iOS signing identity in a temporary keychain
        env:
          IOS_SIGNING_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: python3 pipeline/tools/release/ios_signing.py install --directory "$RUNNER_TEMP/ios-signing" --method "$EXPORT_METHOD"

      - name: Verify App Store app and API access
        if: inputs.upload
        env:
          KEY_ID: ${{ secrets.IOS_APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.IOS_APPLE_API_KEY_P8 }}
        run: python3 pipeline/tools/release/ios_deploy.py check-app --output "$IOS_OUT"

      - name: Fetch runtime LFS assets
        if: inputs.build_kind == 'game'
        working-directory: game
        run: git lfs pull -X 'art/generated/**'

      - name: Cache engine downloads (separate from desktop imports)
        id: engine
        uses: actions/cache@v4
        with:
          path: ~/godot-ios-downloads
          key: godot-ios-mac-${{ env.GODOT_VERSION }}-${{ env.GODOT_MAC_SHA512 }}-${{ env.TEMPLATES_SHA512 }}

      - name: Download pinned Godot and templates
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot-ios-downloads"
          cd "$HOME/godot-ios-downloads"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --retry 3 -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl --retry 3 -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Verify and install toolchain
        run: |
          cd "$HOME/godot-ios-downloads"
          echo "${GODOT_MAC_SHA512}  Godot_v${GODOT_VERSION}-stable_macos.universal.zip" | shasum -a 512 -c -
          echo "${TEMPLATES_SHA512}  Godot_v${GODOT_VERSION}-stable_export_templates.tpz" | shasum -a 512 -c -
          ditto -x -k "Godot_v${GODOT_VERSION}-stable_macos.universal.zip" "$RUNNER_TEMP/godot"
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -o -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates/ios.zip templates/version.txt -d "$templates"
          echo "GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Test build tooling
        run: python3 -m unittest discover -s pipeline/tests/tools -p test_ios_signing.py -v

      - name: Export deployment check
        if: inputs.build_kind == 'smoke'
        run: python3 pipeline/tools/release/ios_deploy.py smoke --output "$IOS_OUT" --source "$GITHUB_WORKSPACE/game"

      - name: Import mobile assets and export Xcode project
        if: inputs.build_kind == 'game'
        working-directory: game
        run: make ios-export IOS_OUT="$IOS_OUT"

      - name: Archive signed device application
        run: |
          xcodebuild -project "$IOS_OUT/xcode/CurseOfStrahd.xcodeproj" -scheme CurseOfStrahd \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$IOS_OUT/CurseOfStrahd.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_UUID" CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $IOS_KEYCHAIN" archive 2>&1 | tee "$IOS_OUT/archive.log"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          apps = list((Path(os.environ['IOS_OUT']) / 'CurseOfStrahd.xcarchive/Products/Applications').glob('*.app'))
          assert len(apps) == 1, 'Expected one archived app'
          size = sum(p.stat().st_size for p in apps[0].rglob('*') if p.is_file())
          (Path(os.environ['IOS_OUT']) / 'app-size.json').write_text(json.dumps({
              'app': apps[0].name, 'uncompressed_bytes': size, 'limit_bytes': 4_000_000_000,
              'within_limit': size <= 4_000_000_000}, indent=2) + '\n')
          assert size <= 4_000_000_000, f'App exceeds 4 GB: {size} bytes'
          print(f'Uncompressed app size: {size:,} bytes')
          PYCODE

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive -archivePath "$IOS_OUT/CurseOfStrahd.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ios-signing/ExportOptions.plist" \
            -exportPath "$IOS_OUT/ipa" > "$IOS_OUT/ipa-export.log" 2>&1
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert len(list((Path(os.environ['IOS_OUT']) / 'ipa').glob('*.ipa'))) == 1, 'Expected one IPA'
          PY
          ditto -c -k --keepParent "$IOS_OUT/CurseOfStrahd.xcarchive" "$IOS_OUT/CurseOfStrahd.xcarchive.zip"

      - name: Upload build for TestFlight processing
        if: inputs.upload
        env:
          KEY_ID: ${{ secrets.IOS_APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.IOS_APPLE_API_KEY_P8 }}
        run: |
          cd "$RUNNER_TEMP/ios-signing"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          assert re.fullmatch(r'[A-Z0-9]+', os.environ['KEY_ID']), 'Invalid API key ID'
          Path('private_keys').mkdir(mode=0o700, exist_ok=True)
          key = Path('private_keys') / ('AuthKey_' + os.environ['KEY_ID'] + '.p8')
          key.write_text(os.environ['KEY_P8'])
          key.chmod(0o600)
          PY
          xcrun altool --upload-app --type ios --file "$IOS_OUT"/ipa/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo 'Uploaded to App Store Connect for processing. This does not submit an App Store release or assign testers.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Apple to process and validate the build
        if: inputs.upload
        env:
          KEY_ID: ${{ secrets.IOS_APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.IOS_APPLE_API_KEY_P8 }}
        run: |
          python3 pipeline/tools/release/ios_deploy.py wait --output "$IOS_OUT"
          echo 'Apple processed the build successfully (VALID). No App Store submission or tester invitations were made.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ios-build/*.log
            ${{ runner.temp }}/ios-source-commit.txt
            ${{ runner.temp }}/ios-build/app-store-build.json
            ${{ runner.temp }}/ios-build/*-inventory.json
            ${{ runner.temp }}/ios-build/toolchain.json
            ${{ runner.temp }}/ios-build/app-size.json
            ${{ runner.temp }}/ios-build/*.xcarchive.zip
            ${{ runner.temp }}/ios-build/ipa/*.ipa
            ${{ runner.temp }}/ios-build/ipa/*.plist

      - name: Remove signing credentials and provisioning profiles
        if: always()
        run: python3 pipeline/tools/release/ios_signing.py cleanup --directory "$RUNNER_TEMP/ios-signing"

  listing:
    needs: tooling
    if: github.event_name == 'workflow_dispatch' && contains(inputs.operation, 'listing')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/release
            docs/releases/app-store
          lfs: true
      - name: Inspect or update the authorized App Store listing
        env:
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          KEY_ID: ${{ secrets.IOS_APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.IOS_APPLE_API_KEY_P8 }}
          VERSION: ${{ inputs.version }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$OPERATION" = update-listing ]; then
            python3 tools/release/ios_store.py apply --version "$VERSION" --manifest docs/releases/app-store/listing.json --output "$RUNNER_TEMP/ios-listing"
          else
            python3 tools/release/ios_store.py inspect --version "$VERSION" --output "$RUNNER_TEMP/ios-listing"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-listing-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-listing/
          retention-days: 14
