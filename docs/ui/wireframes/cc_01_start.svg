<text x="202" y="570" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#f4ecd6" font-weight="bold" text-anchor="start">Ilse Varga</text>
<text x="202" y="594" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">Human Fighter (Champion)</text>
<text x="202" y="611" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">Soldier</text>
<text x="96" y="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c495cf" font-weight="normal" text-anchor="start" font-style="italic">Her company vanished on a fog-bound road.</text>
