<text x="922" y="570" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#f4ecd6" font-weight="bold" text-anchor="start">Hedda Ironvow</text>
<text x="922" y="594" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">Dwarf Cleric (Life Domain)</text>
<text x="922" y="611" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">Acolyte</text>
<text x="816" y="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c495cf" font-weight="normal" text-anchor="start" font-style="italic">Dreams of a silver raven and a dying sun.</text>
