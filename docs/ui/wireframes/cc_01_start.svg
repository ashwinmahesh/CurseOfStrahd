<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Character Creation · Start</title>
<rect x="0" y="0" width="1600" height="900" rx="6" fill="#1a1220"/>
<rect x="0" y="0" width="1600" height="64" rx="0" fill="#0d0a12"/>
<text x="28" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#fbe08a" font-weight="bold" text-anchor="start">Character Creation · Start</text>
<text x="1572" y="40" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="end">Party 0 of 4 built</text>
<rect x="360" y="14" width="168" height="36" rx="6" fill="#4a2160" stroke="#d9731e" stroke-width="2"/>
<text x="372" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f4ecd6" font-weight="bold" text-anchor="start">1  new</text>
<rect x="538" y="14" width="168" height="36" rx="6" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="550" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">2  empty</text>
<rect x="716" y="14" width="168" height="36" rx="6" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="728" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">3  empty</text>
<rect x="894" y="14" width="168" height="36" rx="6" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="906" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">4  empty</text>
<rect x="0" y="840" width="1600" height="60" rx="0" fill="#0d0a12"/>
<text x="800.0" y="876" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="middle">Choose how to make your party. You can change any character later.</text>
<text x="28" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f4ecd6" font-weight="bold" text-anchor="start">Start: who is walking into the mists?</text>
<rect x="60" y="150" width="470" height="230" rx="6" fill="#4a2160" stroke="#d9731e" stroke-width="2"/>
<text x="74" y="176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#f4ecd6" font-weight="bold" text-anchor="start">Pregenerated party</text>
<text x="74" y="198" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Four level 1 characters made for Barovia,</text>
<text x="74" y="217" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">each with a hook into the story.</text>
<text x="74" y="236" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Use them as they are, or edit any step.</text>
<text x="74" y="255" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start"></text>
<text x="74" y="274" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Fastest way into the game.</text>
<rect x="560" y="150" width="470" height="230" rx="6" fill="#271c2e" stroke="#fbe08a" stroke-width="4"/>
<text x="574" y="176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#f4ecd6" font-weight="bold" text-anchor="start">Build from scratch</text>
<text x="574" y="198" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Nine steps per character: Class, Origin,</text>
<text x="574" y="217" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Ability Scores, Class Choices, Equipment,</text>
<text x="574" y="236" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Appearance, Identity, Review.</text>
<text x="574" y="255" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start"></text>
<text x="574" y="274" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Any finished step can be revisited.</text>
<text x="544" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fbe08a" font-weight="bold" text-anchor="start">▸</text>
<rect x="1060" y="150" width="470" height="230" rx="6" fill="#3b3b45" stroke="#3a2a44" stroke-width="1"/>
<text x="1074" y="176" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8a8a96" font-weight="bold" text-anchor="start">Copy from a save</text>
<text x="1074" y="198" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start">Bring a character from another</text>
<text x="1074" y="217" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start">playthrough, then edit freely.</text>
<text x="1074" y="236" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start"></text>
<text x="1074" y="255" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start"></text>
<text x="1074" y="274" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start">Levels and gear come along.</text>
<text x="1074" y="368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#e8606a" font-weight="normal" text-anchor="start">⊘ No other saves yet</text>
