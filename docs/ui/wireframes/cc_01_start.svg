<text x="1282" y="594" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">High Elf Wizard (Evoker)</text>
<text x="1282" y="611" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">Sage</text>
<text x="1176" y="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c495cf" font-weight="normal" text-anchor="start" font-style="italic">Hunts a book written in a vampire&#x27;s hand.</text>
