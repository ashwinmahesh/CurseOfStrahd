<text x="456" y="700" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c495cf" font-weight="normal" text-anchor="start" font-style="italic">A stolen locket shows a woman he&#x27;s never met.</text>
<rect x="456" y="730" width="140" height="34" rx="5" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
