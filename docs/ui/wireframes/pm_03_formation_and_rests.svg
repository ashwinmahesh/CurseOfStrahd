<text x="636" y="182" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">HD 4/4 d10</text>
<text x="636" y="204" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c9dfe8" font-weight="normal" text-anchor="start">Back on finishing: Second Wind +1, Action Surge ✓</text>
<rect x="620" y="260" width="440" height="110" rx="4" fill="#1a1220" stroke="#3a2a44" stroke-width="1"/>
<text x="636" y="284" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f4ecd6" font-weight="bold" text-anchor="start">Tamsin   18/32</text>
<text x="636" y="306" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">HD 2/4 d8</text>
<text x="636" y="328" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c9dfe8" font-weight="normal" text-anchor="start">Back on finishing: —</text>
<rect x="900" y="274" width="140" height="34" rx="5" fill="#d9731e" stroke="#fbe08a" stroke-width="4"/>
<text x="970.0" y="296.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1a1220" font-weight="bold" text-anchor="middle">Spend d8 ⚄</text>
<text x="886" y="297.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fbe08a" font-weight="bold" text-anchor="start">▸</text>
<text x="900" y="330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#fbe08a" font-weight="normal" text-anchor="start">rolled 5 + Con 2 = +7</text>
<rect x="620" y="384" width="440" height="110" rx="4" fill="#1a1220" stroke="#3a2a44" stroke-width="1"/>
<text x="636" y="408" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f4ecd6" font-weight="bold" text-anchor="start">Hedda   35/35</text>
<text x="636" y="430" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">HD 4/4 d8</text>
<text x="636" y="452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c9dfe8" font-weight="normal" text-anchor="start">Back on finishing: Channel Divinity +1</text>
<rect x="620" y="508" width="440" height="110" rx="4" fill="#1a1220" stroke="#3a2a44" stroke-width="1"/>
<text x="636" y="532" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f4ecd6" font-weight="bold" text-anchor="start">Silvain   26/26</text>
<text x="636" y="554" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">HD 4/4 d6</text>
<text x="636" y="576" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c9dfe8" font-weight="normal" text-anchor="start">Back on finishing: Arcane Recovery: 2 slot levels</text>
<circle cx="1060" cy="110" r="13" fill="#fbe08a" stroke="#1a1220" stroke-width="2"/>
<text x="1060" y="115" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1a1220" font-weight="bold" text-anchor="middle">2</text>
<rect x="1096" y="90" width="480" height="720" rx="8" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="1112" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c495cf" font-weight="bold" text-anchor="start">LONG REST (8 hours, camp)</text>
<line x1="1108" y1="130" x2="1564" y2="130" stroke="#3a2a44" stroke-width="1"/>
<text x="1116" y="156" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">Risk of interruption tonight: High</text>
<text x="1116" y="184" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">(Svalich Woods at night, wolves heard)</text>
<text x="1116" y="212" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start"></text>
<text x="1116" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">Watches: Ilse ▸ Tamsin ▸ Hedda ▸ Silvain</text>
<text x="1116" y="268" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start"></text>
<text x="1116" y="296" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">On finishing:</text>
<text x="1116" y="324" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">• All HP and Hit Point Dice back</text>
<text x="1116" y="352" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">• Spell slots and features refresh</text>
<text x="1116" y="380" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">• Exhaustion −1 (Silvain)</text>
<text x="1116" y="408" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">• Then: prepare spells ▸</text>
<rect x="1116" y="720" width="200" height="40" rx="5" fill="#d9731e" stroke="#3a2a44" stroke-width="1"/>
