<text x="60" y="252" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">Passive Perception 12 · Stealth +8</text>
<rect x="44" y="276" width="520" height="56" rx="4" fill="#1a1220" stroke="#3a2a44" stroke-width="1"/>
<text x="60" y="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f4ecd6" font-weight="bold" text-anchor="start">3  Hedda</text>
<text x="60" y="322" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">Darkvision 120 ft</text>
