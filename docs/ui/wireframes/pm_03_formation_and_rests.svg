<text x="60" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f4ecd6" font-weight="bold" text-anchor="start">Guest  Ireena</text>
<text x="60" y="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#bdbdc6" font-weight="normal" text-anchor="start">follows Hedda</text>
<text x="44" y="540" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c495cf" font-weight="normal" text-anchor="start">Formation</text>
