<rect x="440" y="556" width="120" height="36" rx="5" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="500.0" y="579.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6d6b0" font-weight="normal" text-anchor="middle">Spread</text>
<circle cx="53" cy="635" r="9" fill="#f2a93b"/>
<text x="53" y="640" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1a1220" font-weight="bold" text-anchor="middle">~</text>
<text x="70" y="640" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#f2a93b" font-weight="normal" text-anchor="start">Silvain at the back has the best passive Perception (14):</text>
<text x="70" y="660" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#f2a93b" font-weight="normal" text-anchor="start">traps are spotted by the front rank. Swap?</text>
<circle cx="564" cy="110" r="13" fill="#fbe08a" stroke="#1a1220" stroke-width="2"/>
<text x="564" y="115" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1a1220" font-weight="bold" text-anchor="middle">1</text>
