<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Party · Formation and rests</title>
<rect x="0" y="0" width="1600" height="900" rx="6" fill="#1a1220"/>
<rect x="0" y="0" width="1600" height="64" rx="0" fill="#0d0a12"/>
<text x="28" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#fbe08a" font-weight="bold" text-anchor="start">Party · Formation and rests</text>
<text x="1572" y="40" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="end">Marching order and rests</text>
<rect x="0" y="840" width="1600" height="60" rx="0" fill="#0d0a12"/>
<text x="800.0" y="876" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="middle">Order matters for traps and surprise. The leader walks first.</text>
<rect x="1416" y="852" width="160" height="36" rx="5" fill="#d9731e" stroke="#3a2a44" stroke-width="1"/>
<text x="1496.0" y="875.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1a1220" font-weight="bold" text-anchor="middle">Close</text>
