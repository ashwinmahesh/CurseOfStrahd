<text x="40" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c495cf" font-weight="bold" text-anchor="start">MARCHING ORDER &amp; FORMATION</text>
<line x1="36" y1="130" x2="572" y2="130" stroke="#3a2a44" stroke-width="1"/>
<rect x="44" y="136" width="520" height="56" rx="4" fill="#4a2160" stroke="#d9731e" stroke-width="2"/>
