<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Level Up · Choose a class</title>
<rect x="0" y="0" width="1600" height="900" rx="6" fill="#1a1220"/>
<rect x="0" y="0" width="1600" height="64" rx="0" fill="#0d0a12"/>
<text x="28" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#fbe08a" font-weight="bold" text-anchor="start">Level Up · Choose a class</text>
<text x="1572" y="40" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="end">Level up · 1 of 4: Class</text>
<rect x="360" y="14" width="168" height="36" rx="6" fill="#4a2160" stroke="#d9731e" stroke-width="2"/>
<text x="372" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f4ecd6" font-weight="bold" text-anchor="start">1  Ilse ⬆</text>
<rect x="538" y="14" width="168" height="36" rx="6" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="550" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">2  Tamsin ⬆</text>
<rect x="716" y="14" width="168" height="36" rx="6" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="728" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">3  Hedda</text>
<rect x="894" y="14" width="168" height="36" rx="6" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="906" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="start">4  Silvain ⬆</text>
<rect x="0" y="840" width="1600" height="60" rx="0" fill="#0d0a12"/>
<rect x="24" y="852" width="130" height="36" rx="5" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="89.0" y="875.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e6d6b0" font-weight="normal" text-anchor="middle">◂ Back</text>
<text x="800.0" y="876" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#bdbdc6" font-weight="normal" text-anchor="middle">Advance your class, or start a new one if you qualify.</text>
<rect x="1416" y="852" width="160" height="36" rx="5" fill="#d9731e" stroke="#3a2a44" stroke-width="1"/>
<text x="1496.0" y="875.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1a1220" font-weight="bold" text-anchor="middle">Next ▸</text>
<text x="28" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f4ecd6" font-weight="bold" text-anchor="start">Ilse reaches level 4</text>
<rect x="40" y="140" width="368" height="220" rx="6" fill="#4a2160" stroke="#fbe08a" stroke-width="4"/>
<text x="54" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#f4ecd6" font-weight="bold" text-anchor="start">Fighter</text>
<text x="54" y="188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Level 3 → 4</text>
<text x="54" y="207" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start"></text>
<text x="54" y="226" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Ability Score Improvement or a feat</text>
<text x="54" y="245" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Weapon Mastery: 4 weapons</text>
<text x="24" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#fbe08a" font-weight="bold" text-anchor="start">▸</text>
<rect x="424" y="140" width="368" height="220" rx="6" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="438" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#f4ecd6" font-weight="bold" text-anchor="start">Rogue</text>
<text x="438" y="188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">New class (multiclass)</text>
<text x="438" y="207" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start"></text>
<text x="438" y="226" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">Gain: Light armor, Thieves&#x27; Tools,</text>
<text x="438" y="245" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#bdbdc6" font-weight="normal" text-anchor="start">one Rogue skill, Sneak Attack 1d6</text>
<rect x="808" y="140" width="368" height="220" rx="6" fill="#3b3b45" stroke="#3a2a44" stroke-width="1"/>
<text x="822" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8a8a96" font-weight="bold" text-anchor="start">Cleric</text>
<text x="822" y="188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start">New class (multiclass)</text>
<text x="822" y="207" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start"></text>
<text x="822" y="226" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start">Needs Wisdom 13</text>
<text x="822" y="348" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#e8606a" font-weight="normal" text-anchor="start">⊘ Cleric needs Wisdom 13 (you have 10)</text>
<rect x="1192" y="140" width="368" height="220" rx="6" fill="#3b3b45" stroke="#3a2a44" stroke-width="1"/>
<text x="1206" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8a8a96" font-weight="bold" text-anchor="start">Wizard</text>
<text x="1206" y="188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start">New class (multiclass)</text>
<text x="1206" y="207" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start"></text>
<text x="1206" y="226" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a96" font-weight="normal" text-anchor="start">Needs Intelligence 13</text>
<text x="1206" y="348" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#e8606a" font-weight="normal" text-anchor="start">⊘ Wizard needs Intelligence 13 (you have 8)</text>
<circle cx="400" cy="156" r="13" fill="#fbe08a" stroke="#1a1220" stroke-width="2"/>
<text x="400" y="161" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1a1220" font-weight="bold" text-anchor="middle">1</text>
<circle cx="1168" cy="156" r="13" fill="#fbe08a" stroke="#1a1220" stroke-width="2"/>
<text x="1168" y="161" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1a1220" font-weight="bold" text-anchor="middle">2</text>
<rect x="40" y="390" width="1520" height="420" rx="8" fill="#271c2e" stroke="#3a2a44" stroke-width="1"/>
<text x="56" y="418" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c495cf" font-weight="bold" text-anchor="start">WHAT MULTICLASSING MEANS</text>
<line x1="52" y1="430" x2="1548" y2="430" stroke="#3a2a44" stroke-width="1"/>
<text x="64" y="456" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#bdbdc6" font-weight="normal" text-anchor="start">• Your Proficiency Bonus follows your total level; each class&#x27;s features follow that class&#x27;s level.</text>
<text x="64" y="490" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#bdbdc6" font-weight="normal" text-anchor="start">• A new class gives only some of its starting proficiencies (shown on each card) and never level 1 Hit Points.</text>
<text x="64" y="524" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#bdbdc6" font-weight="normal" text-anchor="start">• Spell slots combine across classes; each class prepares its own spells as if single-classed.</text>
<text x="64" y="558" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#bdbdc6" font-weight="normal" text-anchor="start">• To take a new class you need 13 in its primary ability AND in the primary ability of every class you have.</text>
<text x="64" y="592" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#bdbdc6" font-weight="normal" text-anchor="start">• Extra Attack from two classes doesn&#x27;t stack.</text>
<circle cx="73" cy="655" r="9" fill="#8fb2cf"/>
<text x="73" y="660" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#1a1220" font-weight="bold" text-anchor="middle">i</text>
<text x="90" y="660" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9dfe8" font-weight="normal" text-anchor="start">Ilse: Strength 17 meets Fighter&#x27;s &#x27;Strength or Dexterity 13&#x27;. Dexterity 14 meets Rogue&#x27;s 13.</text>
<circle cx="1540" cy="410" r="13" fill="#fbe08a" stroke="#1a1220" stroke-width="2"/>
<text x="1540" y="415" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1a1220" font-weight="bold" text-anchor="middle">3</text>
</svg>
